<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pill Tracker</title>

<!-- PWA install support -->
<link rel="manifest" href="./manifest.json" />

<!-- iOS "Add to Home Screen" specific tags -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pills" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />

<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="app-header">
  <h1>💊 Pill Tracker</h1>
  <button id="enable-notifs">Enable Notifications</button>
</header>

<!-- This is where the pillbox UI renders. Style/rebuild this freely —
     just keep the data-slot-index attribute and the take/undo click
     handlers wired to window.PillTracker so the logic keeps working. -->
<main id="pillbox" class="pillbox">
  <!-- filled in by renderPillbox() -->
</main>

<p class="status-line" id="status-line"></p>

<script type="module" src="./app.js"></script>
<script>
  // --------------------------------------------------------
  // MINIMAL PLACEHOLDER RENDERER — replace/restyle freely.
  // This is intentionally basic; it exists so the app works
  // end-to-end while you build the real pink/cute UI.
  // --------------------------------------------------------
  window.renderPillbox = function (slots, { me, takePill, undoPill }) {
    const container = document.getElementById("pillbox");
    container.innerHTML = "";

    const remaining = slots.filter((s) => !s.taken).length;
    document.getElementById("status-line").textContent =
      `${remaining} of ${slots.length} pills remaining`;

    slots.forEach((slot, i) => {
      const el = document.createElement("button");
      el.className = "pill-slot" + (slot.taken ? " taken" : "");
      el.dataset.slotIndex = i;
      el.textContent = slot.taken ? "✓" : "💊";

      if (slot.taken && slot.takenAt) {
        const when = new Date(slot.takenAt).toLocaleString();
        el.title = `Taken by ${slot.takenBy} at ${when}`;
      }

      el.addEventListener("click", async () => {
        if (!slot.taken) {
          const result = await takePill(i);
          if (!result.ok && result.reason === "already-taken") {
            alert("Someone just logged this one a second ago — refreshing.");
          }
        } else {
          if (confirm(`Undo this log by ${slot.takenBy}?`)) {
            await undoPill(i);
          }
        }
      });

      container.appendChild(el);
    });
  };

  document.getElementById("enable-notifs").addEventListener("click", () => {
    // Must be triggered by a user tap (especially required on iOS)
    window.PillTracker.registerForPush();
  });
</script>
</body>
</html>
